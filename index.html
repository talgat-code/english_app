<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <script>
      (() => {
        const lightThemeColor = '#f8fafc'
        const darkThemeColor = '#121212'

        try {
          const storedTheme = window.localStorage.getItem('theme')
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          const theme =
            storedTheme === 'dark' || (storedTheme !== 'light' && prefersDark)
              ? 'dark'
              : 'light'

          document.documentElement.classList.toggle('dark', theme === 'dark')
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', theme === 'dark' ? darkThemeColor : lightThemeColor)
        } catch {
          document.documentElement.classList.remove('dark')
        }
      })()
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="English" />
    <meta property="og:title" content="English App" />
    <meta
      property="og:description"
      content="Learn English vocabulary with lessons, flashcards, quizzes, and review."
    />
    <meta property="og:image" content="%BASE_URL%og-image.png" />
    <meta property="og:type" content="website" />
    <meta
      name="description"
      content="Learn English vocabulary with flashcards, quizzes, and review."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%BASE_URL%icons/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>English App</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
